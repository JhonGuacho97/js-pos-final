<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sin conexión — EcuaPos</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(145deg, #f5f8ff 0%, #edf3ff 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #333;
    }
    .container {
      text-align: center;
      padding: 2rem;
      max-width: 440px;
      margin: 1rem;
      background: #ffffff;
      border: 1px solid #dce7fb;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(21, 94, 239, 0.12);
    }
    .logo {
      width: 88px;
      height: 88px;
      object-fit: contain;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      color: #1a1a2e;
    }
    p {
      color: #6b7280;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    button {
      background: #155eef;
      color: white;
      border: none;
      padding: 0.75rem 2rem;
      border-radius: 12px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #0f4ccc; }
  </style>
</head>
<body>
  <div class="container">
    <img class="logo" src="/images/pwa/ecuapos-192.png" alt="EcuaPos" />
    <h1>Sin conexión</h1>
    <p>
      EcuaPos no puede conectarse en este momento.<br />
      Verifica tu conexión y vuelve a intentarlo.
    </p>
    <button onclick="window.location.reload()">Reintentar</button>
  </div>
</body>
</html>
